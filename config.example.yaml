# AI Org Agents — Example Configuration
# Copy this file to config.yaml and customize for your project.
# Usage: cp config.example.yaml config.yaml

# =============================================================================
# PROJECT
# =============================================================================
# Path to the root of the project this agent team assists.
# Use '..' if agents/ lives inside your project (most common case).
# Use an absolute path for external deployments.
workspace: ..

project:
  name: "My Startup"                              # shown in agent startup logs and OpenRouter headers
  url: "https://github.com/your-org/your-repo"   # HTTP-Referer header for OpenRouter
  description: "One-line description of your product"

# =============================================================================
# TRANSPORT
# =============================================================================
transport:
  type: discord   # discord | cli
  # cli: stdin/stdout — great for local dev without Discord setup
  # discord: requires DISCORD_TOKEN, GUILD_ID in .env.agents

# =============================================================================
# BRAIN (Knowledge Base)
# =============================================================================
brain:
  # Path to your project's Obsidian vault or markdown knowledge base.
  # Relative to agents/ directory, or absolute path.
  path: ../my-project-brain
  # How many tokens of brain context to load per agent call.
  # Higher = richer context but more tokens per call.
  max_context_tokens: 3000

# =============================================================================
# DISCIPLINE SKILLS (optional)
# =============================================================================
# Directory of Agent Skills (one folder per skill, SKILL.md inside).
# Agents list the skills they use via their `skills:` field below.
skills:
  path: ../.claude/skills      # relative to agents/ directory, or absolute
  max_context_tokens: 2000     # budget for the injected "skills" prompt section

# =============================================================================
# LLM PROVIDER
# =============================================================================
openrouter:
  base_url: https://openrouter.ai/api/v1
  # Set OPENROUTER_API_KEY in your .env file (dotenv loads .env, NOT .env.agents).
  # With $10+ in your account → 1000 req/day on :free models.

# =============================================================================
# MODEL SELECTION STRATEGY
# =============================================================================
# Cost guide (June 2026, OpenRouter):
#   :free models  → $0/1M  (1000 req/day with $10+ in account; fallback to paid if rate-limited)
#   deepseek/deepseek-v4-flash  → $0.098/$0.197 per 1M  (cheap paid fallback)
#   meta-llama/llama-3.3-70b-instruct → ~$0.07/1M (excellent for general tasks)
#   deepseek/deepseek-v4-pro   → $0.435/$0.870 per 1M  (reserve for critical technical tasks)

# =============================================================================
# AGENTS
# =============================================================================
# Add an agent: add a block here + create agents/prompts/<role>.md
# No TypeScript changes needed.
#
# Model tiers:
#   model_fast    → quick factual questions, JSON classification
#   model_default → standard analysis, creative tasks, recommendations
#   model_deep    → complex architecture decisions, deep strategy
#   model_vision  → messages with image attachments (model MUST support image input)
# Fallback: if :free model hits rate limit (429) or is retired from the free tier (404)
# → automatically retries with the paid version of the same model.
#
# Optional per-agent `skills:` list injects discipline skills (Agent Skills standard,
# SKILL.md format) into the system prompt. See top-level `skills:` block and README.

agents:
  founder:
    role: orchestrator   # EXACTLY ONE orchestrator required
    prompt: ./prompts/founder.md
    # Routing (model_fast) stays cheap; CEO reasoning (model_default) uses quality model
    model_fast:    deepseek/deepseek-v4-flash
    model_default: meta-llama/llama-3.3-70b-instruct:free
    model_deep:    meta-llama/llama-3.3-70b-instruct:free   # (deepseek-r1:free was retired from OpenRouter, June 2026)
    model_vision:  google/gemma-4-31b-it:free               # vision-capable, 262k ctx
    discord_channel: ai-team-input
    output_channel: ai-team-output
    can_write_brain: true

  cto:
    role: specialist
    prompt: ./prompts/cto.md
    model_fast:    meta-llama/llama-3.3-70b-instruct:free
    model_default: meta-llama/llama-3.3-70b-instruct:free   # (deepseek-r1:free retired)
    model_deep:    deepseek/deepseek-v4-pro            # Pro ONLY for arch decisions → code
    model_vision:  google/gemma-4-31b-it:free
    discord_channel: cto-channel
    can_write_brain: true

  marketer:
    role: specialist
    prompt: ./prompts/marketer.md
    model_fast:    meta-llama/llama-3.3-70b-instruct:free
    model_default: meta-llama/llama-3.3-70b-instruct:free   # Llama excels at creative tasks
    model_deep:    meta-llama/llama-3.3-70b-instruct:free
    model_vision:  google/gemma-4-31b-it:free
    discord_channel: marketing-channel
    can_write_brain: true

  po:
    role: specialist
    prompt: ./prompts/po.md
    model_fast:    meta-llama/llama-3.3-70b-instruct:free
    model_default: meta-llama/llama-3.3-70b-instruct:free
    model_deep:    meta-llama/llama-3.3-70b-instruct:free    # (deepseek-r1:free retired)
    model_vision:  google/gemma-4-31b-it:free
    discord_channel: po-channel
    can_write_brain: true

  coder:
    role: specialist
    prompt: ./prompts/coder.md
    model_fast:    qwen/qwen3-coder:free          # best free coder, 1M context
    model_default: qwen/qwen3-coder:free
    model_deep:    deepseek/deepseek-v4-flash     # paid fallback for complex specs
    model_vision:  google/gemma-4-31b-it:free     # error screenshots, expected UI
    discord_channel: dev-channel
    can_write_brain: true
    uses_hermes: true    # delegates implementation to hermes -z (code executor)
    # skills: [my-frontend, my-backend]   # optional discipline skills (see skills: block above)
